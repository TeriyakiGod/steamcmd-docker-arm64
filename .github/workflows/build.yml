name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly rebuild picks up new FEX releases and base-image security fixes.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native arm64 runner: tests run on real hardware, not under qemu.
    runs-on: ubuntu-24.04-arm
    env:
      # The secrets context can't be used in step `if:` conditions.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: tests/test-fex-variant.sh

      - name: Lint
        run: |
          shellcheck docker/entrypoint.sh docker/fetch-fex.sh docker/fex-variant tests/*.sh
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint < Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: steamcmd-arm64:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: FULL=1 tests/smoke.sh steamcmd-arm64:test

      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/steamcmd-arm64
            ${{ env.HAS_DOCKERHUB == 'true' && 'docker.io/teriyakigod/steamcmd' || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=arm64,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
